name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to check or publish, for example v1.0.1
        required: true
        type: string
      dry_run:
        description: Run all checks without publishing to npm
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Osyte/fund-pacing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release tag and check npm version
        id: release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'

          const tag = process.env.RELEASE_TAG
          assert.match(tag, /^v\d+\.\d+\.\d+$/, 'Use a stable version tag such as v1.0.1')
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          assert.equal(git('rev-parse', 'HEAD'), git('rev-parse', `refs/tags/${tag}^{commit}`))
          git('merge-base', '--is-ancestor', 'HEAD', 'origin/main')
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          assert.equal(pkg.name, '@osyte/fund-pacing')
          assert.equal(tag, `v${pkg.version}`, 'Tag must match package.json version')
          assert.equal(lock.version, pkg.version)
          assert.equal(lock.packages[''].version, pkg.version)
          assert.equal(lock.packages[''].name, pkg.name)
          assert.equal(pkg.repository.url.toLowerCase(), 'git+https://github.com/osyte/fund-pacing.git')
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number)
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'npm 11.5.1+ is required for OIDC')
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`, {
            signal: AbortSignal.timeout(30000),
          })
          assert(response.ok || response.status === 404, `npm lookup failed: HTTP ${response.status}`)
          const published = response.ok
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`)
          if (published) console.log(`${pkg.name}@${pkg.version} already exists; publishing will be skipped.`)
          NODE
      - name: Install dependencies
        if: steps.release.outputs.published != 'true' || env.DRY_RUN == 'true'
        run: npm ci
      - name: Verify publish without uploading
        if: env.DRY_RUN == 'true'
        # npm publish --dry-run rejects versions that already exist on npm.
        run: |
          npm run verify
          npm pack --dry-run --ignore-scripts
      - name: Publish with trusted publishing and provenance
        if: env.DRY_RUN != 'true' && steps.release.outputs.published != 'true'
        # prepublishOnly runs the full verification before npm uploads anything.
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org
