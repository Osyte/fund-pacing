name: Stage npm release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to check or stage, for example v1.0.1
        required: true
        type: string
      dry_run:
        description: Run all checks without uploading to npm
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Osyte/fund-pacing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.21.1 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Validate release tag and check npm version
        id: release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'

          const tag = process.env.RELEASE_TAG
          assert.match(tag, /^v\d+\.\d+\.\d+$/, 'Use a stable version tag such as v1.0.1')
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          assert.equal(git('rev-parse', 'HEAD'), git('rev-parse', `refs/tags/${tag}^{commit}`))
          git('merge-base', '--is-ancestor', 'HEAD', 'origin/main')
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          assert.equal(pkg.name, '@osyte/fund-pacing')
          assert.equal(tag, `v${pkg.version}`, 'Tag must match package.json version')
          assert.equal(lock.version, pkg.version)
          assert.equal(lock.packages[''].version, pkg.version)
          assert.equal(lock.packages[''].name, pkg.name)
          assert.equal(pkg.repository.url.toLowerCase(), 'git+https://github.com/osyte/fund-pacing.git')
          const [major, minor] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number)
          assert(major > 11 || (major === 11 && minor >= 15), 'npm 11.15.0+ is required for staged publishing')
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`, {
            signal: AbortSignal.timeout(30000),
          })
          assert(response.ok || response.status === 404, `npm lookup failed: HTTP ${response.status}`)
          const published = response.ok
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`)
          if (published) console.log(`${pkg.name}@${pkg.version} already exists; staging will be skipped.`)
          NODE
      - name: Check npm trusted-publisher authentication
        if: steps.release.outputs.published != 'true' || env.DRY_RUN == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const { name } = JSON.parse(readFileSync('package.json', 'utf8'))
          const settings = 'Check npm package Settings → Trusted publishing: organization Osyte, repository fund-pacing, workflow publish.yml, no environment, and staging permission. Unvalidated connections expire after two days; recreate an expired connection before retrying.'
          const requestURL = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
          assert(requestURL && requestToken, 'GitHub OIDC credentials are missing. The publishing job requires id-token: write on a GitHub-hosted runner.')
          const url = new URL(requestURL)
          url.searchParams.set('audience', 'npm:registry.npmjs.org')
          const identity = await fetch(url, {
            headers: { Authorization: `Bearer ${requestToken}` },
            signal: AbortSignal.timeout(30000),
            redirect: 'error',
          })
          assert(identity.ok, `GitHub OIDC token request failed (HTTP ${identity.status}). Check the job's id-token: write permission.`)
          const identityBody = await identity.json().catch(() => null)
          const value = identityBody?.value
          assert(typeof value === 'string' && value.length > 0, 'GitHub returned no OIDC token.')

          // Exchange credentials only: this does not upload, stage, or approve a package.
          // npm performs its own fresh exchange when the staging command runs later.
          const exchange = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${value}` },
            signal: AbortSignal.timeout(30000),
            redirect: 'error',
          })
          assert(exchange.ok, `npm rejected this workflow's trusted-publisher authentication (HTTP ${exchange.status}). ${settings}`)
          const exchangeBody = await exchange.json().catch(() => null)
          const token = exchangeBody?.token
          assert(typeof token === 'string' && token.length > 0, `npm returned no publishing credential. ${settings}`)
          // Never log tokens or response bodies, or save credentials in files or outputs.
          console.log('npm trusted-publisher authentication succeeded. No package was uploaded. A pending connection still requires its first successful publish within the validation deadline.')
          NODE
      - name: Install dependencies
        if: steps.release.outputs.published != 'true' || env.DRY_RUN == 'true'
        run: npm ci
      - name: Verify release without uploading
        if: env.DRY_RUN == 'true'
        # npm publish --dry-run rejects versions that already exist on npm.
        run: |
          npm run verify
          npm pack --dry-run --ignore-scripts
      - name: Stage with trusted publishing and provenance
        if: env.DRY_RUN != 'true' && steps.release.outputs.published != 'true'
        # prepublishOnly runs the full verification before npm uploads anything.
        run: npm stage publish --access public --provenance --registry=https://registry.npmjs.org
